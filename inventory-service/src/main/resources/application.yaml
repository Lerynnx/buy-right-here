server:
  port: 8085

spring:
  application:
    name: inventory-service
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://inventory-db:5432/inventory}
    username: ${SPRING_R2DBC_USERNAME:inventory}
    password: ${SPRING_R2DBC_PASSWORD:inventory}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://inventory-db:5432/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8081/realms/buy-right-here}
  pulsar:
    client:
      service-url: ${PULSAR_SERVICE_URL:pulsar://pulsar:6650}

app:
  pulsar:
    inventory-update-topic: ${PULSAR_INVENTORY_UPDATE_TOPIC:persistent://public/default/inventory-updated}

# --- Actuator: endpoints exposure ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
    enable:
      process: true
      system: true
      jvm: true

  # --- Traces with Zipkin ---
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: ${LOG_FILE:logs/inventory-service.log}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.buy_right_here.inventory: DEBUG
    org.springframework.security: INFO
    org.springframework.r2dbc: INFO
    org.springframework.web: INFO
    org.springframework.pulsar: INFO

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
