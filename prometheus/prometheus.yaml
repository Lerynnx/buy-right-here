global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  # Uncomment when you have more microservices exposing /actuator/prometheus
  # - job_name: 'product-service'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['product-service:8080']