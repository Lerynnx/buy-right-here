server:
  port: 8084

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://product-db:5432/product
    username: product
    password: product
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # the schema is managed by Flyway, so we just validate it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Flyway: migrations only in src/main/resources/db/migration ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Security: JWT validation against Keycloak (same as the Gateway) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8081/realms/tu-realm

  # --- Apache Pulsar: publishing of events (ProductCreated, ProductUpdated...) ---
  pulsar:
    client:
      service-url: ${PULSAR_SERVICE_URL:pulsar://pulsar:6650}
    producer:
      topic-name: persistent://public/default/product-events

app:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
    batch-path: ${INVENTORY_BATCH_PATH:/inventory/batch}
    import-batch-size: ${APP_IMPORT_BATCH_SIZE:200}
  task-executor:
    core-pool-size: ${APP_TASK_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_TASK_EXECUTOR_MAX_POOL_SIZE:5}
    queue-capacity: ${APP_TASK_EXECUTOR_QUEUE_CAPACITY:500}
  pagination:
    default-offset: ${APP_PAGINATION_DEFAULT_OFFSET:0}
    default-limit: ${APP_PAGINATION_DEFAULT_LIMIT:10}
    max-limit: ${APP_PAGINATION_MAX_LIMIT:100}
  export:
    directory: ${APP_EXPORT_DIRECTORY:./src/main/resources/files}
    cleanup-interval: ${APP_EXPORT_CLEANUP_INTERVAL:PT24H}
    page-size: ${APP_EXPORT_PAGE_SIZE:200}
  pulsar:
    import-export-completion-topic: ${PULSAR_IMPORT_EXPORT_COMPLETION_TOPIC:persistent://public/default/product-import-export-completed}
    inventory-update-topic: ${PULSAR_INVENTORY_UPDATE_TOPIC:persistent://public/default/inventory-updated}
    inventory-update-subscription: ${PULSAR_INVENTORY_UPDATE_SUBSCRIPTION:product-service-stock-labels}

# --- Actuator: endpoints exposure ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # /actuator/health/liveness y /readiness para k8s
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  # --- Traces with Zipkin (same endpoint and sampling as the Gateway) ---
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0   # at production, you might want to reduce this to 0.1 or 0.01

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: ${LOG_FILE:logs/product-service.log}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.super-spring.product: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG